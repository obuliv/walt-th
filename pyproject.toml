[project]
name = "walt"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "anthropic>=0.122",
    "jsonschema>=4.17",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.7.0",
    "einops>=0.8.2",
    "transformers<5",
    "matplotlib>=3.11.1",
    "sqlglot>=30.17.0",
    "ollama>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
